openapi: 3.1.0
info:
  title: Hexlet Cal Service
  version: 0.0.0
tags: []
paths:
  /bookings:
    post:
      operationId: GuestBookings_createBooking
      description: Create a booking on an available time slot.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      security:
        - {}
  /bookings/upcoming:
    get:
      operationId: OwnerBookings_listUpcomingBookings
      description: List all upcoming bookings of all event types.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
      security:
        - ApiKeyAuth: []
  /event-types:
    post:
      operationId: OwnerEventTypes_create
      description: Creates a new instance of the resource.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '201':
          description: Resource create operation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: 'Error for create operations: validation failure or duplicate resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateError'
        '409':
          description: 'Error for create operations: validation failure or duplicate resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeCreate'
      security:
        - ApiKeyAuth: []
    get:
      operationId: GuestEventTypes_list
      description: Lists all instances of the resource.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeCollectionWithNextLink'
        '400':
          description: 'Error for list operations: invalid query parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListError'
      security:
        - {}
  /event-types/{id}:
    get:
      operationId: OwnerEventTypes_get
      description: Gets an instance of the resource.
      parameters:
        - $ref: '#/components/parameters/EventTypeKey'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          description: 'Error for read/get operations: resource not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadError'
      security:
        - ApiKeyAuth: []
    patch:
      operationId: OwnerEventTypes_update
      description: Updates an existing instance of the resource.
      parameters:
        - $ref: '#/components/parameters/EventTypeKey'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: 'Error for update operations: validation failure, resource not found, or conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateError'
        '404':
          description: 'Error for update operations: validation failure, resource not found, or conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateError'
        '409':
          description: 'Error for update operations: validation failure, resource not found, or conflict.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeUpdate'
      security:
        - ApiKeyAuth: []
  /slots:
    get:
      operationId: GuestBookings_getAvailableSlots
      description: Get available time slots for the next 14 days for a given event type.
      parameters:
        - name: eventTypeId
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableSlot'
      security:
        - {}
components:
  parameters:
    EventTypeKey:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    AvailableSlot:
      type: object
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          format: date-time
          description: Slot start time.
        endTime:
          type: string
          format: date-time
          description: Slot end time.
      description: Represents an available time slot within the 14-day booking window.
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - startTime
        - endTime
        - createdAt
      properties:
        id:
          type: string
        eventTypeId:
          type: string
          description: ID of the associated event type.
        startTime:
          type: string
          format: date-time
          description: Start time of the booking.
        endTime:
          type: string
          format: date-time
          description: End time of the booking (computed from the event type duration).
        guestName:
          type: string
          description: Optional guest name.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the booking was created.
      description: A booking represents a reserved time slot for a specific event type.
    BookingCreate:
      type: object
      required:
        - eventTypeId
        - startTime
      properties:
        eventTypeId:
          type: string
          description: ID of the event type to book.
        startTime:
          type: string
          format: date-time
          description: Desired start time of the booking.
      description: Request payload for creating a new booking.
    CreateError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message.
      description: 'Error for create operations: validation failure or duplicate resource.'
    EventType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
        name:
          type: string
          description: Human-readable name of the event type.
        description:
          type: string
          description: Detailed description of the event type.
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          description: Duration of the event in minutes.
      description: A calendar event type. Defines a booking category with a fixed duration in minutes.
    EventTypeCollectionWithNextLink:
      type: object
      required:
        - value
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
          description: The items on this page
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      description: Paged response of EventType items
    EventTypeCreate:
      type: object
      required:
        - name
        - description
        - durationMinutes
      properties:
        name:
          type: string
          description: Human-readable name of the event type.
        description:
          type: string
          description: Detailed description of the event type.
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          description: Duration of the event in minutes.
      description: Resource create operation model.
    EventTypeUpdate:
      type: object
      properties:
        name:
          type: string
          description: Human-readable name of the event type.
        description:
          type: string
          description: Detailed description of the event type.
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          description: Duration of the event in minutes.
      description: Resource create or update operation model.
    ListError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message.
      description: 'Error for list operations: invalid query parameters.'
    ReadError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message.
      description: 'Error for read/get operations: resource not found.'
    UpdateError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message.
      description: 'Error for update operations: validation failure, resource not found, or conflict.'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
servers:
  - url: http://localhost:8080
    description: Local development server
    variables: {}
